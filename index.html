<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NBA Predictions</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; max-width:760px; margin:40px auto; padding:0 16px; }
  h1,h2 { font-weight:600; }
  h2 { margin-top:44px; }
  .game { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #2a2a2a; }
  .pick { color:#6ee7a8; font-weight:600; }
  .conf { color:#888; font-variant-numeric:tabular-nums; }
  .muted { color:#666; }
  .big { font-size:26px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:9px 6px; border-bottom:1px solid #222; text-align:left; }
  th { color:#888; font-weight:500; }
  .ok { color:#6ee7a8; }
  .no { color:#f08a8a; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
         color:#c9a227; border:1px solid #5a4a12; border-radius:3px;
         padding:1px 5px; margin-left:8px; }
  .aside { border-left:2px solid #2a2a2a; padding-left:14px; margin-top:10px; }
  .note { font-size:13px; color:#777; margin:6px 0 14px; }
</style>
</head>
<body>
<h1>NBA Predictions</h1>
<p class="muted" id="date"></p>
<div id="games">loading…</div>

<h2>Track record</h2>
<div id="record" class="muted">loading…</div>

<h2>Recent games</h2>
<div id="recent" class="muted">loading…</div>

<div id="preseason-section"></div>

<script>
const today = new Date().toISOString().slice(0,10);

// Predictions logged before preseason support existed have no season_type.
// Those are all regular season.
const typeOf = r => (r.season_type || 'regular');

fetch(`predictions/${today}.json`)
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(rows => {
    document.getElementById('date').textContent = rows[0].game_date;
    document.getElementById('games').innerHTML = rows.map(r => `
      <div class="game">
        <span>${r.away} @ ${r.home}${typeOf(r)==='preseason' ? '<span class="tag">preseason</span>' : ''}</span>
        <span><span class="pick">${r.pick}</span> <span class="conf">${(Math.max(r.p_home,1-r.p_home)*100).toFixed(0)}%</span></span>
      </div>`).join('');
  })
  .catch(() => {
    document.getElementById('games').innerHTML = '<p class="muted">No games today.</p>';
  });

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  const head = lines[0].split(',');
  return lines.slice(1).map(l => {
    const cells = l.split(',');
    const o = {};
    head.forEach((h,i) => o[h] = cells[i]);
    return o;
  });
}

function gamesTable(rows){
  return `
    <table>
      <tr><th>Date</th><th>Game</th><th>Pick</th><th class="num">Conf</th><th>Result</th><th class="num">By</th><th></th></tr>
      ${rows.map(r => {
        const ok = r.correct.toLowerCase() === 'true';
        const margin = Math.abs(parseInt(r.margin));
        return `<tr>
          <td class="muted">${r.game_date.slice(5)}</td>
          <td>${r.away} @ ${r.home}</td>
          <td>${r.pick}</td>
          <td class="num muted">${(parseFloat(r.conf)*100).toFixed(0)}%</td>
          <td>${r.winner}</td>
          <td class="num muted">${margin}</td>
          <td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td>
        </tr>`;
      }).join('')}
    </table>`;
}

fetch('results.csv')
  .then(r => { if(!r.ok) throw 0; return r.text(); })
  .then(txt => {
    const all = parseCSV(txt);
    const reg = all.filter(r => typeOf(r) === 'regular');
    const pre = all.filter(r => typeOf(r) === 'preseason');

    // The headline record is regular season only.
    if (reg.length) {
      const right = reg.filter(r => r.correct.toLowerCase() === 'true').length;
      document.getElementById('record').innerHTML =
        `<p class="big" style="color:#eee;">${right} / ${reg.length} correct <span class="ok">(${(right/reg.length*100).toFixed(1)}%)</span></p>
         <p class="note">Regular-season games only.</p>`;
      document.getElementById('recent').innerHTML = gamesTable(reg.slice(-25).reverse());
    } else {
      document.getElementById('record').textContent = 'No completed regular-season games yet.';
      document.getElementById('recent').textContent = '';
    }

    // Preseason gets its own section, kept out of the record above.
    if (pre.length) {
      const right = pre.filter(r => r.correct.toLowerCase() === 'true').length;
      document.getElementById('preseason-section').innerHTML = `
        <h2>Preseason <span class="tag">not part of the record</span></h2>
        <div class="aside">
          <p class="note">
            Preseason picks are logged and graded, but scored separately. Ratings
            carried from last season describe rosters that have since changed, and
            starters play about 15 minutes, so these games say little about the
            model. They are here for the sake of a complete log, not as a test.
          </p>
          <p style="color:#eee;">${right} / ${pre.length} correct (${(right/pre.length*100).toFixed(1)}%)</p>
          ${gamesTable(pre.slice(-25).reverse())}
        </div>`;
    }
  })
  .catch(() => {
    document.getElementById('record').textContent = 'No completed games yet.';
    document.getElementById('recent').textContent = '';
  });
</script>
</body>
</html>
