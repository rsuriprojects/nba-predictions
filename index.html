<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NBA Predictions</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; max-width:760px; margin:40px auto; padding:0 16px; }
  h1,h2 { font-weight:600; }
  h2 { margin-top:44px; }
  .game { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #2a2a2a; }
  .pick { color:#6ee7a8; font-weight:600; }
  .conf { color:#888; font-variant-numeric:tabular-nums; }
  .muted { color:#666; }
  .big { font-size:26px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:9px 6px; border-bottom:1px solid #222; text-align:left; }
  th { color:#888; font-weight:500; }
  .ok { color:#6ee7a8; }
  .no { color:#f08a8a; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<h1>NBA Predictions</h1>
<p class="muted" id="date"></p>
<div id="games">loading…</div>

<h2>Track record</h2>
<div id="record" class="muted">loading…</div>

<h2>Recent games</h2>
<div id="recent" class="muted">loading…</div>

<script>
const today = new Date().toISOString().slice(0,10);

fetch(`predictions/${today}.json`)
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(rows => {
    document.getElementById('date').textContent = rows[0].game_date;
    document.getElementById('games').innerHTML = rows.map(r => `
      <div class="game">
        <span>${r.away} @ ${r.home}</span>
        <span><span class="pick">${r.pick}</span> <span class="conf">${(Math.max(r.p_home,1-r.p_home)*100).toFixed(0)}%</span></span>
      </div>`).join('');
  })
  .catch(() => {
    document.getElementById('games').innerHTML = '<p class="muted">No games today.</p>';
  });

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  const head = lines[0].split(',');
  return lines.slice(1).map(l => {
    const cells = l.split(',');
    const o = {};
    head.forEach((h,i) => o[h] = cells[i]);
    return o;
  });
}

fetch('results.csv')
  .then(r => { if(!r.ok) throw 0; return r.text(); })
  .then(txt => {
    const rows = parseCSV(txt);
    const n = rows.length;
    const right = rows.filter(r => r.correct.toLowerCase() === 'true').length;
    document.getElementById('record').innerHTML =
      `<p class="big" style="color:#eee;">${right} / ${n} correct <span class="ok">(${(right/n*100).toFixed(1)}%)</span></p>`;

    const recent = rows.slice(-25).reverse();
    document.getElementById('recent').innerHTML = `
      <table>
        <tr><th>Date</th><th>Game</th><th>Pick</th><th class="num">Conf</th><th>Result</th><th class="num">By</th><th></th></tr>
        ${recent.map(r => {
          const ok = r.correct.toLowerCase() === 'true';
          const margin = Math.abs(parseInt(r.margin));
          return `<tr>
            <td class="muted">${r.game_date.slice(5)}</td>
            <td>${r.away} @ ${r.home}</td>
            <td>${r.pick}</td>
            <td class="num muted">${(parseFloat(r.conf)*100).toFixed(0)}%</td>
            <td>${r.winner}</td>
            <td class="num muted">${margin}</td>
            <td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td>
          </tr>`;
        }).join('')}
      </table>`;
  })
  .catch(() => {
    document.getElementById('record').textContent = 'No completed games yet.';
    document.getElementById('recent').textContent = '';
  });
</script>
</body>
</html>
