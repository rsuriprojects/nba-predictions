name: daily predictions

on:
  schedule:
    # 3:17am US Eastern (07:17 UTC during daylight time), after the last West
    # Coast game is final. GitHub has been starting scheduled runs up to ~5
    # hours late, so this still lands before the earliest tip-off.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install pandas numpy lxml html5lib

      - name: run predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
          TEST_DATE: ${{ vars.TEST_DATE }}
        run: python predict.py

      - name: score past predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
        run: python score.py

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "predictions $(date -u +%Y-%m-%d)"
          git pull --rebase || true
          git push
