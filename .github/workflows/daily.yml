name: daily predictions

on:
  schedule:
    # Five tries a day, from 5:17am to 1:17pm US Eastern in winter (an hour
    # later in summer). GitHub has been starting scheduled runs 5-7 hours
    # late, so the early slots usually land mid-morning; a source can also
    # briefly miss games. Every run grades last night and adds any game not
    # yet logged; none changes a pick already logged, and the odds are still
    # fetched once a day. predict.py skips any game that has already tipped off.
    - cron: '17 10 * * *'
    - cron: '47 11 * * *'
    - cron: '17 13 * * *'
    - cron: '47 15 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install pandas numpy lxml html5lib

      - name: run predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
          TEST_DATE: ${{ vars.TEST_DATE }}
          # Read from the environment only; never echoed or written to a file.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py

      - name: score past predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
        run: python score.py

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "predictions $(date -u +%Y-%m-%d)"
          git pull --rebase || true
          git push
