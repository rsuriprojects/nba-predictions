name: daily predictions

on:
  schedule:
    - cron: '0 14 * * *'      # 14:00 UTC = 10am ET
  workflow_dispatch:           # lets you run it manually

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install pandas numpy scikit-learn lxml html5lib

      - name: run predictions
        run: python predict.py

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions/
          git diff --staged --quiet || git commit -m "predictions $(date -u +%Y-%m-%d)"
          git push
