name: daily predictions

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install pandas numpy lxml html5lib

      - name: run predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
          TEST_DATE: ${{ vars.TEST_DATE }}
        run: python predict.py

      - name: score past predictions
        env:
          SEASON: ${{ vars.SEASON || 2027 }}
        run: python score.py

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions/ results.csv
          git diff --staged --quiet || git commit -m "predictions $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
