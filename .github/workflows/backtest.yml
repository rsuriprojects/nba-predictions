name: backtest preseason

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to test (2026 = the 2025-26 season)"
        default: "2023,2024,2025,2026"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy lxml html5lib
      - name: backtest
        env:
          SEASONS: ${{ inputs.seasons }}
        run: python backtest_preseason.py
